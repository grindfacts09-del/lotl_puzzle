<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Landing Page</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for the Inter font and smooth transitions */
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Ensure the main container always covers the full viewport */
        #hero-container {
            height: 100vh;
            width: 100vw;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            /* Placeholder URL - REPLACE THIS with your GitHub image URL */
            background-image: url('assets/Act_2_banner.jpg');
        }
    </style>
</head>
<body>

    <!--
        MAIN CONTAINER:
        1. h-screen w-screen ensures it fills the entire viewport.
        2. flex flex-col items-center justify-end pushes content to the bottom center.
        3. The background image is set in the <style> block above for easier replacement.
    -->
    <div id="hero-container" class="relative flex flex-col items-center justify-end p-8">

        <!--
            OVERLAY:
            Adds a subtle, dark gradient to the bottom to make the links visible against a busy image.
        -->
        <div class="absolute inset-x-0 bottom-0 h-1/2 bg-gradient-to-t from-black/60 to-transparent pointer-events-none"></div>

        <!-- SOCIAL LINKS CONTAINER -->
        <div class="z-10 flex space-x-6 mb-8">
            
            <!--
                SOCIAL LINK 1: DISCORD
                - Corrected to use the standard Discord SVG icon.
                - Note: Update the href="#" with your actual Discord invite link.
            -->

               class="p-3 bg-white/20 backdrop-blur-sm rounded-full shadow-lg hover:scale-105 transition duration-300 text-white border-2 border-white/50 group"
               aria-label="Link to Discord">
               <!-- CORRECT Discord SVG Icon -->
               <svg class="w-6 h-6 group-hover:text-indigo-400 transition duration-300" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

               </svg>
            </a>

            <!--
                SOCIAL LINK 2: X (Twitter)
                - X (Twitter) SVG icon remains correct.
                - Note: Update the href="#" with your actual X profile link.
            -->
            <a href="https://x.com/Monalotls" target="_blank"
               class="p-3 bg-white/20 backdrop-blur-sm rounded-full shadow-lg hover:scale-105 transition duration-300 text-white border-2 border-white/50 group"
               aria-label="Link to X (Twitter)">
               <!-- X (Twitter) SVG Icon -->
               <svg class="w-6 h-6 group-hover:text-indigo-400 transition duration-300" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                   <path d="M18.901 1.956h3.41L15.65 10.966 24 22.042h-7.14L10.59 13.91 3.55 22.042H.14L7.844 12.87.031 1.956h7.52L12.44 8.653l4.64-6.697h1.821zm-2.022 17.585h2.324L6.96 4.34H4.596l12.283 15.196z"/>

        </div>

    </div>

</body>
</html>
